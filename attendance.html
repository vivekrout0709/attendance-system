<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg">
<header>
  <div>
    <h1>Today's Attendance</h1>
    <span id="sectionLabel" class="section-chip">SEC: ...</span>
  </div>
  <button class="logout-btn" onclick="logout()">Logout</button>
</header>

<div class="welcome-card">
  <h2 id="welcomeName">Welcome 👋</h2>
  <p id="liveDateTime" class="live-time"></p>
</div>

<p id="sundayMsg" class="center muted" style="display:none;">Today is Sunday 🎉 Have a fun day!</p>
<div class="container" id="today"></div>

<div class="attendance-info">
  <div class="info-icon">📊</div>
  <div>
    <h2>Attendance Planner</h2>
    <p>See today's <b>Present</b>/<b>Absent</b> impact and how many classes you need to reach <b>80%</b>.</p>
  </div>
</div>

<h2 class="center">Per Subject Attendance</h2>
<div class="container" id="summary"></div>
<div class="whatsapp" onclick="openWAModal()"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"></div>
<div id="waModal" class="wa-modal">
  <div class="wa-box">
    <h3>WhatsApp Support</h3>
    <input id="waReg" placeholder="Register Number">
    <input id="waName" placeholder="Your Name">
    <button onclick="sendWhatsApp()">Send</button>
    <button class="cancel" onclick="closeWAModal()">Cancel</button>
  </div>
</div>

<div class="made-by">© 2026 Made by <b>VIVEK™</b></div>
<script type="module" src="js/attendance.js"></script>
<script>
function openWAModal() {
  document.getElementById("waModal").style.display = "flex";
  const roll = sessionStorage.getItem("roll");
  if (roll) document.getElementById("waReg").value = roll;
}
function closeWAModal() { document.getElementById("waModal").style.display = "none"; }
function sendWhatsApp() {
  const reg = document.getElementById("waReg").value.trim();
  const name = document.getElementById("waName").value.trim();
  if (!reg || !name) return alert("Fill all details");
  const message = `Hello Support Team 👋\nReg No: ${reg}\nName: ${name}\n\nI need help regarding attendance.`;
  window.open("https://wa.me/919337112750?text=" + encodeURIComponent(message), "_blank");
  closeWAModal();
}
</script>
</body>
</html>
